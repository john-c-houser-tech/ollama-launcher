# CI: the helper's tests, the manifest and a bidi scan. No secrets, no network
# beyond the checkout: the tests answer Ollama and ollama.com with made-up data
# and stub the terminal. The ruleset on main requires the one "CI result" check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]  # floor, and the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -I -B -m unittest discover -s tests -v

  checks:
    name: Manifest and bidi scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: manifest.json is valid JSON with the plugin id
        run: |
          python3 -I - <<'EOF'
          import json
          manifest = json.load(open("manifest.json"))
          assert manifest["id"] == "io.github.john-c-houser-tech.ollama-launcher", manifest["id"]
          assert manifest["entryPoints"]["barWidget"] == "BarWidget.qml"
          EOF
      - name: No bidi control characters
        run: |
          if git ls-files -z | xargs -0 grep -lP '[\x{202A}-\x{202E}\x{2066}-\x{2069}]'; then
            echo "The files above contain bidi control characters."
            exit 1
          fi

  # The one check main's ruleset requires.
  result:
    name: CI result
    if: always()
    needs: [tests, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
